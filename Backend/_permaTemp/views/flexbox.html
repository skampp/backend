<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/styles/flextest.css" />
    <title>Document</title>
</head>
<body>
<div class="split-container">
  <div class="pane left" id="leftPane">Left Pane</div>
  <div class="resizer" id="resizer"></div>
  <div class="pane right" id="rightPane">Right Pane</div>
</div>

<script>
  const resizer = document.getElementById('resizer');
  const leftPane = document.getElementById('leftPane');

  let isDragging = false;

  resizer.addEventListener('mousedown', function (e) {
    isDragging = true;
    document.body.style.cursor = 'ew-resize';
  });

  document.addEventListener('mousemove', function (e) {
    if (!isDragging) return;
    const containerOffsetLeft = document.querySelector('.split-container').offsetLeft;
    const newLeftWidth = e.clientX - containerOffsetLeft;
    leftPane.style.width = newLeftWidth + 'px';
  });

  document.addEventListener('mouseup', function () {
    isDragging = false;
    document.body.style.cursor = '';
  });
</script>






</body>
</html>
